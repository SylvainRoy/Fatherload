<style>
  html,body{margin:0;height:100%;background:#07070d;color:#eee;font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100vw;max-height:100vh;aspect-ratio:16/10;display:block}
  .modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
  .modal.open{display:flex}
  .panel{background:#1b1d2a;border:2px solid #556;border-radius:10px;padding:18px 22px;width:min(560px,92vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #000}
  .panel h2{margin:0 0 4px;font-size:22px}
  .panel .sub{margin:0 0 10px;color:#aab;font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-top:1px solid #2c2f40}
  .row .l{flex:1}
  .row small{color:#99a;display:block;font-size:12px}
  .stat{display:inline-block;background:#262a3c;border-radius:6px;padding:3px 8px;margin:0 6px 8px 0;font-size:13px}
  button{background:#3a6df0;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
  button:hover{filter:brightness(1.1)}
  button:disabled{background:#444;color:#888;cursor:not-allowed;filter:none}
  button.sec{background:#555}
  button.danger{background:#c0392b}
  .close{margin-top:12px;width:100%}
  .keys{font-size:13px;color:#bbc;line-height:1.6}
  kbd{background:#333;border:1px solid #666;border-radius:4px;padding:0 5px;font-family:inherit;font-size:12px}
  #touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px;pointer-events:none}
  .pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;pointer-events:auto}
  .pad button,.items button{background:rgba(255,255,255,.18);font-size:22px;border-radius:10px;touch-action:none}
  .items{display:grid;grid-template-columns:repeat(3,48px);gap:6px;pointer-events:auto}
  .items button{font-size:14px;height:44px}
  @media (pointer:coarse){#touch{display:flex}}
</style>

<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="touch">
    <div class="pad">
      <span></span><button data-k="ArrowUp">▲</button><span></span>
      <button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button>
    </div>
    <div class="items">
      <button data-k="1">FUEL</button><button data-k="2">FIX</button><button data-k="3">DYN</button>
      <button data-k="4">C4</button><button data-k="5">TELE</button><button data-k="6">SELL</button>
    </div>
  </div>
  <div id="modal" class="modal"><div id="panel" class="panel"></div></div>
</div>
<script>
(()=>{
'use strict';
// ---------------------------------------------------------------- constants
const TILE=32, COLS=40, ROWS=600, VW=960, VH=600, SKY_ROWS=6, HS=14;
const GRAV=1100, THRUST=2050, HACC=1600, HMAX=270, FALLMAX=820, UPMAX=320, FALL_SAFE=520;
const FUEL_THRUST=0.5, FUEL_FLY=0.18, FUEL_DIG=0.22, FUEL_IDLE=0.015, DIG_BASE=0.5;
const FUEL_PRICE=1.5, REPAIR_PRICE=5;
const SAVE_KEY='fatherload-save-v1';
const T={EMPTY:0,DIRT:1,ROCK:2,LAVA:3,GAS:4,BEDROCK:5};
const LAIR_TOP=ROWS-14, LAIR_BOT=ROWS-3, LAIR_C0=4, LAIR_C1=35;
const ORE0=10;
const ORES=[
  {name:'Ironium',   value:30,     weight:10,  color:'#c9937a', from:0,   rar:1},
  {name:'Bronzium',  value:60,     weight:10,  color:'#d9893a', from:8,   rar:.9},
  {name:'Silverium', value:100,    weight:10,  color:'#dfe3ea', from:20,  rar:.8},
  {name:'Goldium',   value:250,    weight:20,  color:'#ffd33d', from:50,  rar:.65},
  {name:'Platinum',  value:750,    weight:30,  color:'#b9d3f2', from:100, rar:.5},
  {name:'Einsteinium',value:2000,  weight:40,  color:'#8df0ff', from:160, rar:.4},
  {name:'Emerald',   value:5000,   weight:60,  color:'#2ee36b', from:230, rar:.3},
  {name:'Ruby',      value:20000,  weight:80,  color:'#ff3b5c', from:300, rar:.22},
  {name:'Diamond',   value:100000, weight:100, color:'#e8fbff', from:380, rar:.11},
  {name:'Amazonite', value:500000, weight:120, color:'#3cf0c8', from:470, rar:.06},
];
const UPG_PRICES=[750,2000,5000,20000,100000,500000];
const UPG={
  drill: {name:'Drill',      unit:'speed', vals:[1,1.6,2.4,3.4,5,7,10],
          names:['Stock','Silver-tipped','Reinforced','Diamond-tipped','Amazonite','Laser','Quantum']},
  hull:  {name:'Hull',       unit:'HP',    vals:[10,17,30,50,80,120,180],
          names:['Tin','Steel','Titanium','Composite','Reinforced','Nano-armour','Neutronium']},
  engine:{name:'Engine',     unit:'thrust',vals:[1,1.15,1.3,1.5,1.75,2.1,2.6],
          names:['Basic','Twin','V6','Turbo','Ion','Fusion','Antimatter']},
  tank:  {name:'Fuel tank',  unit:'L',     vals:[10,15,25,40,60,100,150],
          names:['Micro','Medium','Large','Huge','Giant','Titanic','Leviathan']},
  rad:   {name:'Radiator',   unit:'% lava protection', vals:[0,25,45,60,75,85,95],
          names:['None','Basic','Dual','Triple','Cryo','Quantum','Perfect']},
  cargo: {name:'Cargo bay',  unit:'kg',    vals:[70,150,300,500,800,1200,2000],
          names:['Micro','Medium','Large','Huge','Giant','Titanic','Leviathan']},
};
const ITEMS=[
  {key:'fuel', name:'Reserve Fuel Tank', price:2000, desc:'Instantly adds 25 L of fuel.'},
  {key:'nano', name:'Repair Nanobots',   price:7500, desc:'Repairs 30 hull points anywhere.'},
  {key:'dyn',  name:'Dynamite',          price:2000, desc:'Blows up everything within 1 block (even rock).'},
  {key:'c4',   name:'Plastic Explosives',price:5000, desc:'Blows up everything within 2 blocks.'},
  {key:'tele', name:'Quantum Teleporter',price:2000, desc:'Teleports your pod to the surface, right at the mineral processing plant.'},
  {key:'trans',name:'Matter Transmitter',price:10000,desc:'Sells your whole cargo from anywhere.'},
];
const BUILDINGS=[
  {id:'fuel',   name:'FUEL STATION',      c0:2,  c1:5,  color:'#c43d2f'},
  {id:'sell',   name:'MINERAL PROCESSING',c0:9,  c1:13, color:'#3573c4'},
  {id:'junk',   name:'JUNK SHOP',         c0:17, c1:20, color:'#8e44ad'},
  {id:'repair', name:'REPAIR SHOP',       c0:24, c1:27, color:'#27ae60'},
  {id:'upg',    name:'UPGRADE SHOP',      c0:31, c1:36, color:'#d68910'},
];
const START_X=15*TILE+TILE/2;

// ---------------------------------------------------------------- utils
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const modal=document.getElementById('modal'), panel=document.getElementById('panel');
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b));
const fmtMoney=m=>'$'+m.toLocaleString('en-US',{maximumFractionDigits:2});
const oreOf=t=>t>=ORE0?ORES[t-ORE0]:null;

// ---------------------------------------------------------------- audio
let actx=null, muted=false;
function beep(f,d,type='square',g=.05,slide=0){
  if(muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), gn=actx.createGain(), t=actx.currentTime;
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const SFX={
  dig:()=>beep(70+Math.random()*30,.09,'sawtooth',.025),
  ore:()=>{beep(880,.1,'sine',.05);setTimeout(()=>beep(1320,.12,'sine',.05),70);},
  coin:()=>{beep(1200,.08,'square',.04);setTimeout(()=>beep(1800,.12,'square',.04),80);},
  hurt:()=>beep(160,.3,'sawtooth',.09,50),
  boom:()=>beep(90,.5,'sawtooth',.12,25),
  nope:()=>beep(200,.12,'square',.04,120),
  buy:()=>beep(600,.1,'triangle',.06,900),
  tele:()=>beep(300,.5,'sine',.06,1500),
  fire:()=>beep(420,.25,'sawtooth',.05,120),
  roar:()=>beep(70,.9,'sawtooth',.14,35),
};

// ---------------------------------------------------------------- world
let world=new Uint8Array(COLS*ROWS);
const getT=(c,r)=>(c<0||c>=COLS||r<0||r>=ROWS)?T.BEDROCK:world[r*COLS+c];
const setT=(c,r,v)=>{if(c>=0&&c<COLS&&r>=0&&r<ROWS)world[r*COLS+c]=v;};
const solid=(c,r)=>r<0?(c<0||c>=COLS):getT(c,r)!==T.EMPTY;
const diggable=t=>t!==T.EMPTY&&t!==T.ROCK&&t!==T.BEDROCK;

function oreWeight(o,r){
  if(r<o.from) return 0;
  const x=r-o.from;
  return o.rar*Math.min(1,(x+4)/25)*Math.max(.12,1-x/200);
}
function pickOre(r){
  let tot=0; const ws=ORES.map(o=>{const w=oreWeight(o,r);tot+=w;return w;});
  if(tot<=0) return -1;
  let u=Math.random()*tot;
  for(let i=0;i<ORES.length;i++){u-=ws[i]; if(u<=0) return i;}
  return ORES.length-1;
}
function genWorld(){
  world=new Uint8Array(COLS*ROWS);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let t=T.DIRT;
    if(r>=ROWS-2) t=T.BEDROCK;
    else if(r>0){
      const u=Math.random();
      const pRock=.025+r/ROWS*.13;
      const pLava=r>=80?.006+(r-80)/ROWS*.05:0;
      const pGas=r>=40?.012:0;
      const pOre=.085;
      if(u<pRock) t=T.ROCK;
      else if(u<pRock+pLava) t=T.LAVA;
      else if(u<pRock+pLava+pGas) t=T.GAS;
      else if(u<pRock+pLava+pGas+pOre){const i=pickOre(r); if(i>=0) t=ORE0+i;}
    }
    world[r*COLS+c]=t;
  }
  // clustering pass: ores and rock tend to come in veins
  for(let r=1;r<ROWS-2;r++)for(let c=0;c<COLS;c++){
    const t=world[r*COLS+c];
    if((t>=ORE0||t===T.ROCK)&&Math.random()<.4){
      const dc=Math.random()<.5?1:0, dr=1-dc;
      if(getT(c+dc,r+dr)===T.DIRT) setT(c+dc,r+dr,t);
    }
  }
  // the Devil's lair at the bottom
  for(let r=LAIR_TOP;r<=LAIR_BOT;r++)for(let c=LAIR_C0;c<=LAIR_C1;c++) setT(c,r,T.EMPTY);
  for(let r=LAIR_TOP;r<=LAIR_BOT;r++){setT(LAIR_C0-1,r,T.BEDROCK);setT(LAIR_C1+1,r,T.BEDROCK);}
  for(let c=LAIR_C0;c<=LAIR_C1;c++) if(c%4===1) setT(c,ROWS-2,T.LAVA);
}
function encodeWorld(){let s='';for(let i=0;i<world.length;i++)s+=String.fromCharCode(65+world[i]);return s;}
function decodeWorld(s){world=new Uint8Array(COLS*ROWS);for(let i=0;i<world.length&&i<s.length;i++)world[i]=s.charCodeAt(i)-65;}

// ---------------------------------------------------------------- textures
const TEX={}, NVAR=3;
const hash=(c,r)=>(((c*73856093)^(r*19349663))>>>0);
function makeTex(fn,w=TILE,h=TILE){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
const DIRT_COLS=['#7c5433','#704a2d','#634127','#573923','#4c3220','#41291c'];
const TUNNEL_COLS=['#3a2616','#33200f','#2c1b0e','#25160b','#1e1109','#170c06'];
function blob(g,x,y,r,color,pts=9,rough=.3){
  g.fillStyle=color; g.beginPath();
  for(let i=0;i<pts;i++){const a=i/pts*Math.PI*2, rr=r*(1-rough/2+Math.random()*rough); const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; i?g.lineTo(px,py):g.moveTo(px,py);}
  g.closePath(); g.fill();
}
function dirtBase(g,band){
  const base=DIRT_COLS[band];
  g.fillStyle=base; g.fillRect(0,0,TILE,TILE);
  for(let i=0;i<14;i++) blob(g,rnd(0,TILE),rnd(0,TILE),rnd(3,7),`rgba(${rndi(0,50)},${rndi(0,25)},0,${rnd(.12,.3)})`,7,.6);
  for(let i=0;i<7;i++) blob(g,rnd(0,TILE),rnd(0,TILE),rnd(2,4),`rgba(255,215,170,${rnd(.08,.18)})`,6,.6);
  for(let i=0;i<5;i++){g.fillStyle=`rgba(${rndi(90,130)},${rndi(80,110)},${rndi(70,100)},.6)`; blob(g,rnd(0,TILE),rnd(0,TILE),rnd(1.5,3),g.fillStyle,6,.5);}
}
function gem(g,x,y,s,color){
  g.save(); g.translate(x,y); g.rotate(rnd(0,Math.PI));
  g.fillStyle='rgba(0,0,0,.35)'; g.beginPath(); g.moveTo(1,-s+1); g.lineTo(s*.8+1,1); g.lineTo(1,s+1); g.lineTo(-s*.8+1,1); g.closePath(); g.fill();
  g.fillStyle=color; g.beginPath(); g.moveTo(0,-s); g.lineTo(s*.8,0); g.lineTo(0,s); g.lineTo(-s*.8,0); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.moveTo(0,-s*.7); g.lineTo(s*.35,-s*.15); g.lineTo(-s*.25,-s*.15); g.closePath(); g.fill();
  g.restore();
}
function boulder(g){
  g.save(); g.translate(16,16);
  g.fillStyle='rgba(0,0,0,.35)'; blob(g,2,3,14.5,g.fillStyle,11,.18);
  blob(g,0,0,14.5,'#6f737c',11,.2);
  g.globalCompositeOperation='source-atop';
  blob(g,-4,-5,9,'rgba(255,255,255,.14)',8,.4);
  blob(g,5,6,9,'rgba(0,0,0,.22)',8,.4);
  for(let i=0;i<10;i++) blob(g,rnd(-12,12),rnd(-12,12),rnd(1.5,4),`rgba(${rndi(70,150)},${rndi(70,150)},${rndi(80,160)},.5)`,6,.6);
  g.strokeStyle='rgba(0,0,0,.4)'; g.lineWidth=1.2;
  for(let i=0;i<3;i++){g.beginPath();const x=rnd(-10,10),y=rnd(-10,10);g.moveTo(x,y);g.lineTo(x+rnd(-8,8),y+rnd(-8,8));g.lineTo(x+rnd(-8,8),y+rnd(-8,8));g.stroke();}
  g.restore();
}
function edgeSprite(side,band){ // jagged strip of tunnel colour eating into the tile edge
  return makeTex(g=>{
    g.save();
    if(side===1) g.translate(TILE,0), g.rotate(Math.PI/2);
    if(side===2) g.translate(TILE,TILE), g.rotate(Math.PI);
    if(side===3) g.translate(0,TILE), g.rotate(-Math.PI/2);
    g.fillStyle=TUNNEL_COLS[band]; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TILE;x+=4) g.lineTo(x,rnd(1,6));
    g.lineTo(TILE,0); g.closePath(); g.fill();
    g.fillStyle='rgba(0,0,0,.28)'; g.beginPath(); g.moveTo(0,0);
    for(let x=0;x<=TILE;x+=4) g.lineTo(x,rnd(4,10));
    g.lineTo(TILE,0); g.closePath(); g.fill();
    g.restore();
  });
}
function buildTextures(){
  for(let b=0;b<6;b++)for(let v=0;v<NVAR;v++){
    TEX[`d${b}_${v}`]=makeTex(g=>dirtBase(g,b));
    TEX[`gas${b}_${v}`]=makeTex(g=>{dirtBase(g,b);g.fillStyle='rgba(40,60,20,.35)';blob(g,16,16,13,g.fillStyle,9,.4);for(let i=0;i<7;i++){blob(g,rnd(6,26),rnd(6,26),rnd(2,5),'rgba(140,255,140,.45)',8,.2);}});
    for(let i=0;i<ORES.length;i++) TEX[`o${i}_${b}_${v}`]=makeTex(g=>{dirtBase(g,b);const n=rndi(3,6);for(let k=0;k<n;k++)gem(g,rnd(6,26),rnd(6,26),rnd(3,5.5),ORES[i].color);});
    for(let s=0;s<4;s++) TEX[`e${s}_${b}_${v}`]=edgeSprite(s,b);
  }
  for(let v=0;v<NVAR;v++){
    TEX['rock'+v]=makeTex(boulder);
    TEX['lava'+v]=makeTex(g=>{
      g.fillStyle='#8a2a08'; g.fillRect(0,0,TILE,TILE);
      for(let i=0;i<8;i++) blob(g,rnd(0,TILE),rnd(0,TILE),rnd(4,9),'#d9480f',8,.5);
      for(let i=0;i<8;i++) blob(g,rnd(0,TILE),rnd(0,TILE),rnd(2,5),'rgba(255,200,40,.75)',7,.5);
      for(let i=0;i<5;i++) blob(g,rnd(0,TILE),rnd(0,TILE),rnd(2,5),'rgba(40,5,0,.6)',7,.5);
    });
  }
  TEX.bedrock=makeTex(g=>{
    g.fillStyle='#2b2d33'; g.fillRect(0,0,TILE,TILE);
    g.fillStyle='#3a3d45'; g.fillRect(2,2,TILE-4,TILE-4);
    g.fillStyle='#1c1d22'; [[6,6],[26,6],[6,26],[26,26]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,2,0,7);g.fill();});
  });
  TEX.grass=makeTex(g=>{
    g.fillStyle='#3b7a2a'; g.fillRect(0,2,TILE,6);
    g.fillStyle='#4f9a36'; for(let x=0;x<TILE;x+=3){g.fillRect(x,rnd(0,3),2,5);}
    g.fillStyle='#2f6522'; for(let i=0;i<6;i++) g.fillRect(rnd(0,TILE),5,2,3);
  },TILE,8);
}
function texFor(t,c,r){
  const b=clamp(Math.floor(r/100),0,5), v=hash(c,r)%NVAR;
  if(t===T.DIRT) return TEX[`d${b}_${v}`];
  if(t===T.ROCK) return TEX['rock'+v];
  if(t===T.BEDROCK) return TEX.bedrock;
  if(t===T.LAVA) return TEX['lava'+(Math.floor(time*2+v)%NVAR)];
  if(t===T.GAS) return TEX[`gas${b}_${v}`];
  if(t>=ORE0) return TEX[`o${t-ORE0}_${b}_${v}`];
  return null;
}

// ---------------------------------------------------------------- state
let P=null, running=false, paused=false, gameOver=false;
const keys={}, floats=[], parts=[], rocks=[];
let shake=0, lavaPulse=0, digSfxT=0, hintT=0, lastHint='';

function newPlayer(){
  return {x:START_X,y:-HS,vx:0,vy:0,grounded:false,facing:1,state:'free',dig:null,
    fuel:UPG.tank.vals[0],hull:UPG.hull.vals[0],money:20,cargo:[],
    inv:{fuel:0,nano:0,dyn:0,c4:0,tele:0,trans:0},
    lv:{drill:0,hull:0,engine:0,tank:0,rad:0,cargo:0},
    maxDepth:0,won:false,shopLock:null,earned:0,bossHp:null,bossDead:false};
}
const lv=k=>UPG[k].vals[P.lv[k]];
const cargoWeight=()=>P.cargo.reduce((s,i)=>s+ORES[i].weight,0);
const cargoValue=()=>P.cargo.reduce((s,i)=>s+ORES[i].value,0);
const podCol=()=>clamp(Math.floor(P.x/TILE),0,COLS-1);
const podRow=()=>Math.floor((P.y+HS-1)/TILE);
const depthFt=()=>Math.max(0,podRow())*10;
const onSurface=()=>P.y+HS<=0;

function addFloat(text,color='#fff',x=P.x,y=P.y-24){floats.push({x,y,text,color,t:0});}
function hint(text,color='#ffd'){ if(hintT>0&&lastHint===text) return false; lastHint=text; hintT=1.2; addFloat(text,color); return true; }
function burst(x,y,n,color,speed=180){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(speed*.3,speed);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,t:0,life:rnd(.3,.8),color,size:rnd(2,5)});}}

function startGame(fresh){
  gameOver=false; paused=false; floats.length=0; parts.length=0; rocks.length=0;
  if(fresh||!loadGame()){ genWorld(); P=newPlayer(); }
  boss=newBoss(); shots.length=0;
  for(let r=ROWS-2;r>=0;r--)for(let c=0;c<COLS;c++) checkSupport(c,r);
  running=true; closeModal();
}
function saveGame(){
  try{
    const {shopLock,...rest}=P;
    const w=encodeWorld().split(''); rocks.forEach(k=>{const r=clamp(Math.round(k.y/TILE),0,ROWS-1); w[r*COLS+k.c]=String.fromCharCode(65+T.ROCK);});
    localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,world:w.join(''),P:rest}));
    return true;
  }catch(e){return false;}
}
function loadGame(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!s||s.v!==1) return false;
    decodeWorld(s.world); P=Object.assign(newPlayer(),s.P); P.state='free'; P.dig=null; P.vx=P.vy=0;
    return true;
  }catch(e){return false;}
}
const hasSave=()=>!!localStorage.getItem(SAVE_KEY);

// ---------------------------------------------------------------- damage / fuel
function damage(n,why){
  n=Math.max(1,Math.round(n));
  P.hull-=n; shake=Math.min(14,4+n); SFX.hurt();
  addFloat(`-${Math.round(n)} hull${why?' ('+why+')':''}`,'#ff6b6b');
  if(P.hull<=0){P.hull=0; endGame('Your pod was destroyed'+(why?' by '+why:'')+'.');}
}
function useFuel(n){
  if(P.fuel<=0) return;
  P.fuel=Math.max(0,P.fuel-n);
  if(P.fuel<=0){
    if(P.inv.fuel>0){useItem('fuel',true);}
    else if(onSurface()&&BUILDINGS[0].c0<=podCol()&&podCol()<=BUILDINGS[0].c1){P.shopLock=null; addFloat('Out of fuel — refuel here!','#ff6b6b');}
    else endGame(onSurface()?'Your pod ran out of fuel and is stranded on the surface, out of reach of the fuel station.':'Your pod ran out of fuel and is lost underground forever.');
  }
}
function endGame(reason){
  gameOver=true; running=false;
  openPanel(`<h2>Game Over</h2><p class="sub">${reason}</p>
    <div><span class="stat">Earned ${fmtMoney(P.earned)}</span><span class="stat">Max depth ${P.maxDepth*10} ft</span></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${hasSave()?'<button id="b-load">Load last save</button>':''}
      <button id="b-new" class="sec">New game</button></div>`);
  bind('b-new',()=>startGame(true)); bind('b-load',()=>startGame(false));
}

// ---------------------------------------------------------------- falling rocks
function checkSupport(c,r){
  if(r<0||getT(c,r)!==T.ROCK||getT(c,r+1)!==T.EMPTY) return;
  setT(c,r,T.EMPTY); rocks.push({c,y:r*TILE,y0:r*TILE,vy:0,t:0});
  checkSupport(c,r-1);
}
function updateRocks(dt){
  for(let i=rocks.length-1;i>=0;i--){
    const k=rocks[i]; k.t+=dt;
    if(k.t<.25) continue; // brief wobble before it drops
    k.vy=Math.min(FALLMAX,k.vy+GRAV*dt);
    const ny=k.y+k.vy*dt, rx=k.c*TILE;
    const below=rocks.find(o=>o!==k&&o.c===k.c&&o.y>k.y&&o.y<ny+TILE);
    if(below){ k.y=below.y-TILE; k.vy=0; continue; } // stacked on another falling rock
    if(rx<P.x+HS&&rx+TILE>P.x-HS&&ny+TILE>P.y-HS&&k.y+TILE<=P.y){ // lands on the pod: rests there, or shatters after a long fall
      k.y=P.y-HS-TILE;
      if(k.vy>300){ damage(Math.ceil(k.vy/200),'falling rock'); burst(rx+16,P.y-HS,14,'#aaa',160); shake=Math.max(shake,5); beep(60,.2,'sawtooth',.08,30); }
      if(k.y-k.y0>SHATTER_FALL){ shatterRock(k,P.y-HS); rocks.splice(i,1); continue; }
      k.vy=0; continue;
    }
    const r=Math.floor((ny+TILE)/TILE);
    if(solid(k.c,r)){
      let land=r-1; while(land>=0&&getT(k.c,land)!==T.EMPTY) land--;
      rocks.splice(i,1);
      if(land*TILE-k.y0>SHATTER_FALL){ shatterRock(k,(land+1)*TILE); continue; }
      if(land>=0) setT(k.c,land,T.ROCK);
      if(k.vy>250){ burst(rx+16,(land+1)*TILE,10,'#999',150); beep(70,.15,'sawtooth',.06,40); if(Math.abs(P.y-land*TILE)<300) shake=Math.max(shake,3); }
      continue;
    }
    k.y=ny;
  }
}
const SHATTER_FALL=2*TILE; // a rock falling more than twice its size breaks apart
function shatterRock(k,y){ const x=k.c*TILE+16; burst(x,y,26,'#9a9a9a',220); burst(x,y,12,'#666',140); beep(55,.3,'sawtooth',.1,25); if(Math.abs(P.y-y)<300) shake=Math.max(shake,6); }
const rockAbove=(c0,c1,top)=>rocks.find(k=>k.c>=c0&&k.c<=c1&&k.t>=.25&&k.y+TILE<=top+1&&k.y+TILE>top-20);

// ---------------------------------------------------------------- the Devil (end boss)
let boss=null, shots=[];
const BOSS_HP=200, BOSS_BONUS=1000000;
function newBoss(){return {x:(LAIR_C0+LAIR_C1+1)/2*TILE,y:(LAIR_TOP+5)*TILE,vx:0,vy:0,hp:P.bossHp==null?BOSS_HP:P.bossHp,maxHp:BOSS_HP,state:P.bossDead?'dead':'sleep',t:0,shotT:2.5,chargeT:7,contactT:0,face:1,flash:0};}
const bossActive=()=>boss&&boss.state!=='dead'&&boss.state!=='sleep';
function updateBoss(dt){
  const b=boss; if(!b||b.state==='dead') return;
  b.t+=dt; b.flash=Math.max(0,b.flash-dt);
  if(b.state==='sleep'){
    if(podRow()>=LAIR_TOP-1&&P.state==='free'){
      b.state='awake'; b.t=0; SFX.roar(); shake=16;
      openInfo('The Fatherload is guarded',`A huge horned figure rises from the lava at the bottom of the pit.<br><i>"So, another little digger has come for my Fatherload. You will burn like the others!"</i><br><br>Dodge his fireballs and charges. Hurt him with <b>Dynamite</b> / <b>Plastic Explosives</b> detonated close to him (keys 3 / 4), or ram him with your drill. Kill him to claim the Fatherload.`,'Fight!');
    }
    return;
  }
  const dx=P.x-b.x, dy=P.y-b.y;
  if(b.state!=='charge') b.face=dx<0?-1:1;
  if(b.state==='awake'){
    const tx=clamp(P.x+Math.sin(b.t*.7)*140,(LAIR_C0+1)*TILE,LAIR_C1*TILE), ty=clamp(P.y-100+Math.sin(b.t*1.3)*40,(LAIR_TOP+1)*TILE+10,(LAIR_BOT-1)*TILE);
    b.vx=lerp(b.vx,clamp((tx-b.x)*1.5,-170,170),dt*2.5); b.vy=lerp(b.vy,clamp((ty-b.y)*1.5,-170,170),dt*2.5);
    b.shotT-=dt;
    if(b.shotT<=0&&b.t>1.5){
      b.shotT=b.hp<b.maxHp/2?rnd(1,1.8):rnd(1.6,2.6);
      const n=b.hp<b.maxHp/2?3:1, a0=Math.atan2(dy,dx-b.face*18);
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.25; shots.push({x:b.x+b.face*18,y:b.y-10,vx:Math.cos(a)*270,vy:Math.sin(a)*270,t:0});}
      SFX.fire();
    }
    b.chargeT-=dt; if(b.chargeT<=0){b.state='windup'; b.t=0; b.vx*=.2; b.vy*=.2;}
  } else if(b.state==='windup'){
    if(b.t>.7){ b.state='charge'; b.t=0; const a=Math.atan2(dy,dx); b.vx=Math.cos(a)*560; b.vy=Math.sin(a)*560; SFX.roar(); }
  } else if(b.state==='charge'){
    if(b.t>.75){ b.state='awake'; b.t=2; b.chargeT=rnd(4,7); b.vx*=.2; b.vy*=.2; }
  }
  b.x=clamp(b.x+b.vx*dt,LAIR_C0*TILE+30,(LAIR_C1+1)*TILE-30); b.y=clamp(b.y+b.vy*dt,LAIR_TOP*TILE+40,(LAIR_BOT+1)*TILE-40);
  // contact with the pod
  if(Math.abs(dx)<24+HS&&Math.abs(dy)<34+HS){
    b.contactT-=dt;
    if(b.contactT<=0){
      b.contactT=.5;
      const pushing=(kd('ArrowLeft','a','A','q','Q')&&dx>0)||(kd('ArrowRight','d','D')&&dx<0)||(kd('ArrowDown','s','S')&&dy<0)||(kd('ArrowUp','w','W','z','Z',' ')&&dy>0);
      if(pushing) hitBoss(5+4*P.lv.drill);
      damage(b.state==='charge'?8:3,'the Devil');
      P.vx+=Math.sign(dx||1)*260; P.vy-=120; if(b.state==='charge'){b.state='awake'; b.t=2; b.chargeT=rnd(4,7); b.vx*=-.3; b.vy*=-.3;}
    }
  } else b.contactT=0;
  // fireballs
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i]; s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(Math.abs(s.x-P.x)<HS+5&&Math.abs(s.y-P.y)<HS+5){ damage(Math.round(6*(1-lv('rad')/200)),'fireball'); burst(s.x,s.y,15,'#ff7a1a',200); shots.splice(i,1); continue; }
    if(s.t>4||solid(Math.floor(s.x/TILE),Math.floor(s.y/TILE))){ burst(s.x,s.y,10,'#ff7a1a',150); shots.splice(i,1); continue; }
    if(Math.random()<.6) parts.push({x:s.x,y:s.y,vx:rnd(-20,20),vy:rnd(-30,0),t:0,life:.35,color:'#ffae42',size:rnd(3,6),smoke:true});
  }
}
function hitBoss(n){
  const b=boss; if(!bossActive()) return;
  b.hp=Math.max(0,b.hp-n); b.flash=.25; P.bossHp=b.hp;
  addFloat(`-${n}`,'#ffae42',b.x,b.y-56); burst(b.x,b.y,15,'#ff3b3b',200); SFX.hurt();
  if(b.hp<=0) killBoss();
}
function killBoss(){
  const b=boss; b.state='dead'; P.bossDead=true; P.won=true; shots.length=0;
  shake=24; SFX.boom(); burst(b.x,b.y,120,'#ff3b3b',420); burst(b.x,b.y,80,'#ffae42',320); burst(b.x,b.y,60,'#3cf0c8',260);
  P.money+=BOSS_BONUS; P.earned+=BOSS_BONUS; saveGame();
  openPanel(`<h2>VICTORY</h2><p class="sub">The Devil dissolves into smoke — and there it is: the Fatherload, a seam of pure Amazonite as big as a house. You are rich beyond counting, and the first digger ever to come back up alive.</p>
    <div><span class="stat">Fatherload bonus ${fmtMoney(BOSS_BONUS)}</span><span class="stat">Total earned ${fmtMoney(P.earned)}</span><span class="stat">Max depth ${P.maxDepth*10} ft</span></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button id="b-keep">Keep playing</button><button id="b-new" class="sec">New game</button></div>`);
  bind('b-keep',closeModal); bind('b-new',()=>startGame(true));
}
function drawBoss(){
  const b=boss; if(!b||b.state==='dead'||b.state==='sleep') return;
  const sx=b.x-camX, sy=b.y-camY; if(sx<-100||sx>VW+100||sy<-120||sy>VH+120) return;
  const k=Math.min(1,b.t/.8), flap=Math.sin(time*7)*.5, red=b.flash>0?'#ff9a9a':'#b3261e', dark=b.flash>0?'#ffcccc':'#73120d';
  ctx.save(); ctx.translate(sx,sy); ctx.scale(b.face*(b.state==='awake'&&b.t<.8?k:1),b.state==='awake'&&b.t<.8?k:1);
  if(b.state==='windup'){ctx.fillStyle=`rgba(255,80,30,${.25+.2*Math.sin(time*30)})`; ctx.beginPath(); ctx.arc(0,0,60,0,7); ctx.fill();}
  // wings
  ctx.fillStyle=dark;
  for(const s of [-1,1]){ctx.save(); ctx.scale(s,1); ctx.beginPath(); ctx.moveTo(10,-12); ctx.quadraticCurveTo(45,-45-flap*30,78,-22-flap*44); ctx.lineTo(66,-2-flap*22); ctx.lineTo(56,8-flap*10); ctx.lineTo(44,12); ctx.quadraticCurveTo(26,4,10,10); ctx.closePath(); ctx.fill(); ctx.restore();}
  // tail
  const tw=Math.sin(time*3)*10;
  ctx.strokeStyle=red; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-10,26); ctx.quadraticCurveTo(-42,44+tw,-48,16+tw); ctx.stroke();
  ctx.fillStyle=red; ctx.beginPath(); ctx.moveTo(-54,22+tw); ctx.lineTo(-42,20+tw); ctx.lineTo(-48,8+tw); ctx.closePath(); ctx.fill();
  // legs & hooves
  ctx.fillStyle=dark; ctx.fillRect(-15,22,9,18); ctx.fillRect(6,22,9,18); ctx.fillStyle='#111'; ctx.fillRect(-16,38,11,5); ctx.fillRect(5,38,11,5);
  // body
  ctx.fillStyle=red; ctx.beginPath(); ctx.ellipse(0,8,21,27,0,0,7); ctx.fill();
  ctx.fillStyle=dark; ctx.beginPath(); ctx.ellipse(0,12,11,16,0,0,7); ctx.fill();
  ctx.fillStyle=red; ctx.fillRect(-5,-2,10,3); ctx.fillRect(-5,6,10,3); ctx.fillRect(-5,14,10,3);
  // arm + trident
  ctx.strokeStyle=red; ctx.lineWidth=8; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(14,-2); ctx.lineTo(28,12); ctx.stroke();
  ctx.strokeStyle='#ccd'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(30,34); ctx.lineTo(30,-44); ctx.moveTo(20,-44); ctx.lineTo(40,-44); ctx.moveTo(20,-44); ctx.lineTo(20,-58); ctx.moveTo(30,-44); ctx.lineTo(30,-62); ctx.moveTo(40,-44); ctx.lineTo(40,-58); ctx.stroke();
  // head, horns, face
  ctx.fillStyle=red; ctx.beginPath(); ctx.ellipse(0,-27,13,14,0,0,7); ctx.fill();
  ctx.fillStyle='#f3e4b0'; for(const s of [-1,1]){ctx.beginPath(); ctx.moveTo(s*7,-36); ctx.lineTo(s*19,-58); ctx.lineTo(s*13,-33); ctx.closePath(); ctx.fill();}
  ctx.fillStyle='#ffe34d'; ctx.shadowColor='#ffb000'; ctx.shadowBlur=8; ctx.fillRect(2,-31,6,3); ctx.fillRect(-8,-31,6,3); ctx.shadowBlur=0;
  ctx.fillStyle='#000'; ctx.fillRect(-7,-20,14,4); ctx.fillStyle='#fff'; ctx.fillRect(-6,-20,2,2); ctx.fillRect(-1,-20,2,2); ctx.fillRect(4,-20,2,2);
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.moveTo(-5,-40); ctx.lineTo(0,-50); ctx.lineTo(5,-40); ctx.closePath(); ctx.fill(); // goatee-ish tuft
  ctx.restore();
  shots.forEach(s=>{const x=s.x-camX,y=s.y-camY; ctx.fillStyle='rgba(255,120,30,.5)'; ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.fill(); ctx.fillStyle='#ff7a1a'; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill(); ctx.fillStyle='#ffe34d'; ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill();});
}

// ---------------------------------------------------------------- digging
function tryDig(c,r,dir){
  const t=getT(c,r);
  if(t===T.EMPTY) return false;
  if(!diggable(t)){ if(hint(t===T.BEDROCK?'Bedrock: impenetrable':'Rock: too hard for your drill','#ccc')){ SFX.nope(); burst(c*TILE+16,r*TILE+16,6,'#ddd',120);} return false; }
  let hard;
  if(t===T.DIRT) hard=1+r/200;
  else if(t>=ORE0) hard=1.3+(t-ORE0)*.3+r/300;
  else hard=1+r/300;
  P.state='dig'; P.vx=P.vy=0;
  P.dig={fx:P.x,fy:P.y,tx:c*TILE+TILE/2,ty:r*TILE+TILE-HS,t:0,dur:DIG_BASE*hard/lv('drill'),c,r,dir};
  if(dir!=='down') P.facing=dir;
  return true;
}
function finishDig(){
  const {c,r,tx,ty}=P.dig, t=getT(c,r);
  setT(c,r,T.EMPTY); P.x=tx; P.y=ty; P.state='free'; P.dig=null; P.vx=P.vy=0;
  if(r>P.maxDepth) P.maxDepth=r;
  checkSupport(c,r-1);
  const ore=oreOf(t);
  if(ore){
    if(cargoWeight()+ore.weight<=lv('cargo')){P.cargo.push(t-ORE0); addFloat('+ '+ore.name,ore.color); SFX.ore();}
    else {addFloat('Cargo bay full! '+ore.name+' lost','#ffb347'); SFX.nope();}
  } else if(t===T.LAVA){
    burst(tx,ty,30,'#ff7a1a',260); damage(Math.round(9*(1-lv('rad')/100)*10)/10,'lava');
  } else if(t===T.GAS){
    burst(tx,ty,40,'#9cff9c',320); SFX.boom(); damage(8,'gas explosion');
  }
}
function explode(radius){
  const c=podCol(), r=podRow();
  let lostOre=0;
  for(let dr=-radius;dr<=radius;dr++)for(let dc=-radius;dc<=radius;dc++){
    const t=getT(c+dc,r+dr);
    if(t!==T.EMPTY&&t!==T.BEDROCK){ if(t>=ORE0) lostOre++; setT(c+dc,r+dr,T.EMPTY); }
  }
  for(let dc=-radius;dc<=radius;dc++) checkSupport(c+dc,r-radius-1);
  shake=12; SFX.boom(); burst(P.x,P.y,60,'#ffae42',380); burst(P.x,P.y,30,'#777',260);
  if(lostOre) addFloat(`${lostOre} mineral${lostOre>1?'s':''} destroyed`,'#ffb347');
  if(bossActive()&&Math.hypot(boss.x-P.x,boss.y-P.y)<(radius+1.6)*TILE) hitBoss(radius===1?30:70);
}

// ---------------------------------------------------------------- items
function useItem(key,auto=false){
  if(!P||gameOver||P.state!=='free'&&key!=='fuel') return;
  if(P.inv[key]<=0){if(hint('You have no '+ITEMS.find(i=>i.key===key).name,'#ccc'))SFX.nope();return;}
  switch(key){
    case 'fuel': P.fuel=Math.min(lv('tank'),P.fuel+25); addFloat(auto?'Reserve fuel tank used!':'+25 L fuel','#7CFC00'); break;
    case 'nano': if(P.hull>=lv('hull')){hint('Hull is already intact');SFX.nope();return;} P.hull=Math.min(lv('hull'),P.hull+30); addFloat('+30 hull','#7CFC00'); break;
    case 'dyn': explode(1); break;
    case 'c4': explode(2); break;
    case 'tele': P.x=(BUILDINGS[1].c0+BUILDINGS[1].c1+1)/2*TILE; P.y=-HS; P.vx=P.vy=0; P.shopLock=null; SFX.tele(); burst(P.x,P.y,30,'#9ad0ff',200); break;
    case 'trans': if(!P.cargo.length){hint('Cargo bay is empty');SFX.nope();return;} sellCargo(); break;
  }
  P.inv[key]--; SFX.buy();
}
function sellCargo(){
  const v=cargoValue(); P.money+=v; P.earned+=v; P.cargo=[];
  addFloat('+'+fmtMoney(v),'#ffd33d'); SFX.coin();
}

// ---------------------------------------------------------------- physics
function moveX(dx){
  if(dx===0) return false;
  let nx=P.x+dx;
  if(nx-HS<0){P.x=HS;P.vx=0;return true;}
  if(nx+HS>COLS*TILE){P.x=COLS*TILE-HS;P.vx=0;return true;}
  const r0=Math.floor((P.y-HS)/TILE), r1=Math.floor((P.y+HS-1)/TILE);
  if(dx>0){const c=Math.floor((nx+HS-1)/TILE); for(let r=r0;r<=r1;r++) if(solid(c,r)){P.x=c*TILE-HS;P.vx=0;return true;}}
  else {const c=Math.floor((nx-HS)/TILE); for(let r=r0;r<=r1;r++) if(solid(c,r)){P.x=(c+1)*TILE+HS;P.vx=0;return true;}}
  P.x=nx; return false;
}
function moveY(dy){
  let ny=P.y+dy;
  const c0=Math.floor((P.x-HS)/TILE), c1=Math.floor((P.x+HS-1)/TILE);
  let landed=false;
  if(ny-HS<-SKY_ROWS*TILE){ny=-SKY_ROWS*TILE+HS; if(P.vy<0)P.vy=0;}
  if(dy>0){const r=Math.floor((ny+HS)/TILE); for(let c=c0;c<=c1;c++) if(solid(c,r)){ny=r*TILE-HS;landed=true;break;}}
  else if(dy<0){const r=Math.floor((ny-HS)/TILE); for(let c=c0;c<=c1;c++) if(solid(c,r)){ny=(r+1)*TILE+HS;P.vy=0;break;}}
  if(dy<0){const k=rockAbove(c0,c1,P.y-HS); if(k&&ny-HS<k.y+TILE){ny=k.y+TILE+HS;P.vy=0;}}
  P.y=ny;
  const rb=Math.floor((P.y+HS)/TILE);
  P.grounded=false;
  if(Number.isInteger((P.y+HS)/TILE)) for(let c=c0;c<=c1;c++) if(solid(c,rb)){P.grounded=true;break;}
  if(landed){
    const v=P.vy; P.vy=0;
    if(v>FALL_SAFE){ damage(Math.round((v-FALL_SAFE)/32*10)/10,'crash landing'); }
    else if(v>200) beep(120,.06,'square',.03);
  }
}
const kd=(...ks)=>ks.some(k=>keys[k]);

function update(dt){
  if(P.state==='dig'){
    const d=P.dig; d.t+=dt; const k=Math.min(1,d.t/d.dur);
    P.x=lerp(d.fx,d.tx,k); P.y=lerp(d.fy,d.ty,k);
    useFuel(FUEL_DIG*dt);
    digSfxT-=dt; if(digSfxT<=0){digSfxT=.09; SFX.dig(); const col=getT(d.c,d.r)===T.LAVA?'#ff7a1a':DIRT_COLS[clamp(Math.floor(d.r/100),0,5)]; burst(d.tx+rnd(-10,10),d.ty+rnd(-10,10),2,col,140);}
    if(k>=1&&!gameOver) finishDig();
    return;
  }
  const left=kd('ArrowLeft','a','A','q','Q'), right=kd('ArrowRight','d','D'), up=kd('ArrowUp','w','W','z','Z',' '), down=kd('ArrowDown','s','S');
  P.thrusting=false;
  if(up&&P.fuel>0){P.vy-=THRUST*lv('engine')*dt; P.thrusting=true; useFuel(FUEL_THRUST*dt);}
  P.vy+=GRAV*dt;
  P.vy=clamp(P.vy,-UPMAX*Math.sqrt(lv('engine')),FALLMAX);
  let h=0; if(left)h-=1; if(right)h+=1;
  if(h&&P.fuel>0){P.vx+=h*HACC*dt; P.facing=h; useFuel((P.grounded?FUEL_FLY*.5:FUEL_FLY)*dt);}
  else {P.vx*=Math.max(0,1-12*dt); if(Math.abs(P.vx)<4)P.vx=0;}
  P.vx=clamp(P.vx,-HMAX,HMAX);
  if(!P.grounded||h) useFuel(FUEL_IDLE*dt*(podRow()>0?1:0));
  const hitX=moveX(P.vx*dt);
  moveY(P.vy*dt);
  if(gameOver) return;

  // digging
  if(P.grounded&&P.fuel>0){
    const c=podCol(), rBelow=Math.floor((P.y+HS)/TILE);
    if(down){
      if(getT(c,rBelow)===T.EMPTY){ P.x=lerp(P.x,c*TILE+TILE/2,Math.min(1,dt*12)); }
      else tryDig(c,rBelow,'down');
    } else if(h&&hitX){
      const r=Math.floor(P.y/TILE);
      if(solid(c+h,r)) tryDig(c+h,r,h);
    }
  }
  // surface buildings
  if(P.grounded&&Math.floor((P.y+HS)/TILE)===0&&P.state==='free'){
    const c=podCol(), b=BUILDINGS.find(b=>c>=b.c0&&c<=b.c1);
    if(b){ if(P.shopLock!==b.id||keys._e){P.shopLock=b.id; keys._e=false; openShop(b);} }
    else P.shopLock=null;
  } else if(!P.grounded) { P.shopLock=null; }
  keys._e=false;
  if(podRow()>P.maxDepth) P.maxDepth=podRow();
}

function openShop(b){
  saveGame(); spaceAction=null;
  const r=[`<h2 style="color:${b.color}">${b.name}</h2>`];
  const rows=[];
  if(b.id==='fuel'){
    r.push('<p class="sub">Fuel for your pod. Running dry underground means game over.</p>');
    const need=lv('tank')-P.fuel;
    [[5,'5 L'],[25,'25 L'],[need,'Fill tank ('+need.toFixed(1)+' L)']].forEach(([amt,label],i)=>{
      const a=Math.min(amt,need), price=a*FUEL_PRICE;
      rows.push({l:label,s:`${fmtMoney(price)}`,dis:a<=0.01||P.money<price,fn:()=>{P.fuel+=a;P.money-=price;SFX.buy();}});
    });
    if(need>0.01&&P.money<need*FUEL_PRICE&&P.money>0){const a=Math.floor(P.money/FUEL_PRICE*10)/10;if(a>0)rows.push({l:`All I can afford (${a} L)`,s:fmtMoney(a*FUEL_PRICE),fn:()=>{P.fuel+=a;P.money-=a*FUEL_PRICE;SFX.buy();}});}
    spaceAction={label:'fill the tank',fn:()=>{const a=Math.min(lv('tank')-P.fuel,Math.floor(P.money/FUEL_PRICE*10)/10); if(a<=0.01) return false; P.fuel+=a;P.money-=a*FUEL_PRICE;SFX.buy();return true;}};
  } else if(b.id==='sell'){
    r.push('<p class="sub">We buy any mineral you bring up, at market price.</p>');
    const counts={}; P.cargo.forEach(i=>counts[i]=(counts[i]||0)+1);
    if(!P.cargo.length) r.push('<p class="sub"><i>Your cargo bay is empty.</i></p>');
    Object.keys(counts).map(Number).sort((a,b)=>a-b).forEach(i=>r.push(`<div class="row"><div class="l"><span style="color:${ORES[i].color}">■</span> ${ORES[i].name} × ${counts[i]}</div><div>${fmtMoney(ORES[i].value*counts[i])}</div></div>`));
    rows.push({l:'<b>Sell everything</b>',s:fmtMoney(cargoValue()),dis:!P.cargo.length,fn:()=>sellCargo()});
    spaceAction={label:'sell everything',fn:()=>{if(!P.cargo.length) return false; sellCargo(); return true;}};
  } else if(b.id==='junk'){
    r.push('<p class="sub">Odds and ends. Use with keys <kbd>1</kbd>–<kbd>6</kbd> while mining.</p>');
    ITEMS.forEach((it,i)=>rows.push({l:`<b>${i+1}. ${it.name}</b> <span style="color:#9a9">(owned: ${P.inv[it.key]})</span><small>${it.desc}</small>`,s:fmtMoney(it.price),dis:P.money<it.price,fn:()=>{P.money-=it.price;P.inv[it.key]++;SFX.buy();}}));
  } else if(b.id==='repair'){
    r.push(`<p class="sub">Hull repairs at ${fmtMoney(REPAIR_PRICE)} per point.</p>`);
    const need=lv('hull')-P.hull;
    [[Math.min(10,need),'Repair 10 HP'],[need,'Full repair ('+need+' HP)']].forEach(([a,label])=>{
      rows.push({l:label,s:fmtMoney(a*REPAIR_PRICE),dis:a<=0||P.money<a*REPAIR_PRICE,fn:()=>{P.hull+=a;P.money-=a*REPAIR_PRICE;SFX.buy();}});
    });
    spaceAction={label:'repair the hull',fn:()=>{const a=Math.min(need,Math.floor(P.money/REPAIR_PRICE)); if(a<=0) return false; P.hull+=a;P.money-=a*REPAIR_PRICE;SFX.buy();return true;}};
    if(need>0&&P.money<need*REPAIR_PRICE){const a=Math.floor(P.money/REPAIR_PRICE);if(a>0&&a<10)rows.push({l:`Repair ${a} HP (all you can afford)`,s:fmtMoney(a*REPAIR_PRICE),fn:()=>{P.hull+=a;P.money-=a*REPAIR_PRICE;SFX.buy();}});}
  } else if(b.id==='upg'){
    r.push('<p class="sub">Better gear lets you dig deeper, faster and safer. Your game is saved every time you enter a shop.</p>');
    Object.keys(UPG).forEach(k=>{
      const u=UPG[k], l=P.lv[k], next=l+1<u.vals.length;
      const cur=`${u.names[l]} — ${u.vals[l]} ${u.unit}`;
      if(next){const price=UPG_PRICES[l]; rows.push({l:`<b>${u.name}</b>: ${cur}<small>Upgrade to ${u.names[l+1]} — ${u.vals[l+1]} ${u.unit}</small>`,s:fmtMoney(price),dis:P.money<price,fn:()=>{P.money-=price;P.lv[k]++;if(k==='hull')P.hull+=u.vals[l+1]-u.vals[l];if(k==='tank')P.fuel+=u.vals[l+1]-u.vals[l];SFX.buy();}});}
      else r.push(`<div class="row"><div class="l"><b>${u.name}</b>: ${cur}<small>Fully upgraded</small></div><div>—</div></div>`);
    });
  }
  r.push(statusBar());
  rows.forEach((row,i)=>r.push(`<div class="row"><div class="l">${row.l}</div><button id="r${i}" ${row.dis?'disabled':''}>${row.s}</button></div>`));
  r.push(`<button id="b-close" class="close sec">Leave (Esc / Space)</button>`);
  if(spaceAction) r.push(`<p class="sub" style="text-align:center;margin:8px 0 0"><kbd>Space</kbd> ${spaceAction.label}, then <kbd>Space</kbd> again to leave</p>`);
  openPanel(r.join(''));
  rows.forEach((row,i)=>bind('r'+i,()=>{row.fn();saveGame();openShop(b);}));
  const act=spaceAction; bind('b-close',()=>{closeModal();});
  shopSpace=()=>{ if(act&&act.fn()){saveGame();openShop(b);} else closeModal(); };
}

  ctx.fillStyle='#4a7d33'; ctx.beginPath(); ctx.moveTo(0,gy); for(let x=0;x<=VW;x+=20){const wx=x+camX*.6; ctx.lineTo(x,gy-14-10*Math.sin(wx/60+2)-6*Math.sin(wx/23));} ctx.lineTo(VW,gy); ctx.closePath(); ctx.fill();
  // trees
  for(const tc of [0,7,15,22,29,38]){const tx=tc*TILE+16-camX; if(tx<-40||tx>VW+40) continue; ctx.fillStyle='#5a3b1e'; ctx.fillRect(tx-3,gy-30,6,30); ctx.fillStyle='#2f7a2a'; ctx.beginPath(); ctx.arc(tx,gy-42,16,0,7); ctx.arc(tx-10,gy-32,11,0,7); ctx.arc(tx+10,gy-32,11,0,7); ctx.fill(); ctx.fillStyle='#3f9a35'; ctx.beginPath(); ctx.arc(tx-4,gy-46,8,0,7); ctx.fill();}
  // grass strip over the top edge of row 0
  for(let c=Math.max(0,Math.floor(camX/TILE));c<=Math.min(COLS-1,Math.floor((camX+VW)/TILE));c++) if(getT(c,0)!==T.EMPTY) ctx.drawImage(TEX.grass,c*TILE-camX,gy-6);
}
function render(){
  if(!P){ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);return;}
  camX=clamp(P.x-VW/2,0,COLS*TILE-VW); camY=clamp(P.y-VH/2,-SKY_ROWS*TILE,ROWS*TILE-VH);
  if(shake>0){camX+=rnd(-shake,shake);camY+=rnd(-shake,shake);}
  // background
  const r0=Math.floor(camY/TILE), r1=Math.floor((camY+VH)/TILE), c0=Math.floor(camX/TILE), c1=Math.min(COLS-1,Math.floor((camX+VW)/TILE));
  if(camY<0){
    const g=ctx.createLinearGradient(0,-SKY_ROWS*TILE-camY,0,-camY); g.addColorStop(0,'#2a6fd6'); g.addColorStop(1,'#9fd3ff');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,Math.max(0,-camY));
    ctx.fillStyle='#ffe97a'; ctx.beginPath(); ctx.arc(820-camX*.3,-150-camY,26,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    [[120,-140,60],[400,-100,80],[900,-170,70],[1150,-120,50]].forEach(([x,y,w])=>{const cx=x-camX*.5,cy=y-camY;ctx.beginPath();ctx.ellipse(cx,cy,w,14,0,0,7);ctx.ellipse(cx-w*.3,cy-8,w*.5,14,0,0,7);ctx.ellipse(cx+w*.3,cy-6,w*.45,12,0,0,7);ctx.fill();});
  }
  for(let r=Math.max(0,r0);r<=r1&&r<ROWS;r++){ctx.fillStyle=TUNNEL_COLS[clamp(Math.floor(r/100),0,5)]; ctx.fillRect(0,r*TILE-camY,VW,TILE);}
  // tiles
  for(let r=Math.max(0,r0);r<=r1&&r<ROWS;r++)for(let c=Math.max(0,c0);c<=c1;c++){
    const t=world[r*COLS+c]; if(t===T.EMPTY) continue;
    const sx=c*TILE-camX, sy=r*TILE-camY;
    const tex=texFor(t,c,r); if(tex) ctx.drawImage(tex,sx,sy);
    if(t===T.LAVA){ctx.fillStyle=`rgba(255,220,60,${.12+.12*Math.sin(time*5+c+r)})`; ctx.fillRect(sx,sy,TILE,TILE);}
    if(t!==T.ROCK&&t!==T.BEDROCK){
      const b=clamp(Math.floor(r/100),0,5), v=hash(r,c)%NVAR;
      if(r>0&&getT(c,r-1)===T.EMPTY) ctx.drawImage(TEX[`e0_${b}_${v}`],sx,sy);
      if(getT(c+1,r)===T.EMPTY) ctx.drawImage(TEX[`e1_${b}_${v}`],sx,sy);
      if(getT(c,r+1)===T.EMPTY) ctx.drawImage(TEX[`e2_${b}_${v}`],sx,sy);
      if(getT(c-1,r)===T.EMPTY) ctx.drawImage(TEX[`e3_${b}_${v}`],sx,sy);
    }
  }
  rocks.forEach(k=>{const wob=k.t<.25?Math.sin(k.t*60)*2:0; ctx.drawImage(TEX['rock'+(k.c%NVAR)],k.c*TILE-camX+wob,k.y-camY);});
  if(camY<0){ drawSurfaceDecor(); BUILDINGS.forEach(drawBuilding); }
  // particles
  parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x-camX-p.size/2,p.y-camY-p.size/2,p.size,p.size);}); ctx.globalAlpha=1;
  drawBoss();
  drawPod(P.x-camX,P.y-camY);
  // darkness
  const dark=podRow()>=LAIR_TOP-1?.3:clamp((podRow()-15)/160,0,.92);
  if(dark>0){
    const g=ctx.createRadialGradient(P.x-camX,P.y-camY,50,P.x-camX,P.y-camY,330);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,`rgba(0,0,0,${dark*.5})`); g.addColorStop(1,`rgba(0,0,0,${dark})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  }
  // floats
  ctx.font='bold 14px system-ui,Arial'; ctx.textAlign='center';
  floats.forEach(f=>{ctx.globalAlpha=clamp(1.6-f.t,0,1); ctx.fillStyle='#000'; ctx.fillText(f.text,f.x-camX+1,f.y-camY-f.t*30+1); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x-camX,f.y-camY-f.t*30);}); ctx.globalAlpha=1; ctx.textAlign='left';
  drawHUD();
}
function bar(x,y,w,h,k,color,label){
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=color; ctx.fillRect(x+2,y+2,(w-4)*clamp(k,0,1),h-4);
  ctx.fillStyle='#fff'; ctx.font='bold 12px system-ui,Arial'; ctx.fillText(label,x+6,y+h-5);
}
function drawHUD(){
  ctx.save();
  ctx.fillStyle='rgba(10,10,20,.72)'; roundRect(8,8,250,112,8); ctx.fill();
  const fk=P.fuel/lv('tank'), hk=P.hull/lv('hull'), ck=cargoWeight()/lv('cargo');
  bar(16,16,234,18,fk,fk<.25?'#e74c3c':'#2ecc71',`FUEL  ${P.fuel.toFixed(1)} / ${lv('tank')} L`);
  bar(16,38,234,18,hk,hk<.3?'#e74c3c':'#3498db',`HULL  ${P.hull} / ${lv('hull')}`);
  bar(16,60,234,18,ck,ck>=1?'#e67e22':'#9b59b6',`CARGO  ${cargoWeight()} / ${lv('cargo')} kg  (${fmtMoney(cargoValue())})`);
  ctx.fillStyle='#ffd33d'; ctx.font='bold 16px system-ui,Arial'; ctx.fillText(fmtMoney(P.money),16,98);
  ctx.fillStyle='#ddd'; ctx.font='13px system-ui,Arial'; ctx.fillText(`Depth ${depthFt()} ft   (max ${P.maxDepth*10})`,16,114);
  // inventory
  const owned=ITEMS.filter(it=>P.inv[it.key]>0);
  if(owned.length){
    ctx.fillStyle='rgba(10,10,20,.72)'; roundRect(VW-8-190,8,190,16+owned.length*17,8); ctx.fill();
    ctx.fillStyle='#eee'; ctx.font='12px system-ui,Arial';
    owned.forEach((it,i)=>ctx.fillText(`[${ITEMS.indexOf(it)+1}] ${it.name} × ${P.inv[it.key]}`,VW-190,24+i*17));
  }
  if(bossActive()) bar(VW/2-150,8,300,20,boss.hp/boss.maxHp,'#c0392b',`THE DEVIL  ${boss.hp} / ${boss.maxHp}`);
  if(muted){ctx.fillStyle='#aaa';ctx.font='12px system-ui,Arial';ctx.textAlign='right';ctx.fillText('muted (M)',VW-14,VH-10);ctx.textAlign='left';}
  if(P.fuel<lv('tank')*.2&&podRow()>0&&Math.floor(time*2)%2===0){ctx.fillStyle='#ff5555';ctx.font='bold 16px system-ui,Arial';ctx.textAlign='center';ctx.fillText('LOW FUEL',VW/2,34);ctx.textAlign='left';}
  ctx.restore();
}

// ---------------------------------------------------------------- loop
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt;
  if(running&&!paused){
    update(dt); if(!gameOver){updateRocks(dt); updateBoss(dt);}
    shake=Math.max(0,shake-dt*40); hintT-=dt;
    for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt; if(floats[i].t>1.6) floats.splice(i,1);}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.t+=dt; if(!p.smoke) p.vy+=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.t>p.life) parts.splice(i,1);}
  }
  render();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
window.addEventListener('keydown',e=>{
  if(e.repeat&&!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.key==='Escape'){ if(modal.classList.contains('open')&&running) closeModal(); return; }
  if(e.key===' '&&modal.classList.contains('open')&&running&&shopSpace){ shopSpace(); return; }
  if(paused||!running) return;
  keys[e.key]=true;
  if(e.key>='1'&&e.key<='6') useItem(ITEMS[+e.key-1].key);
  if(e.key==='m'||e.key==='M') muted=!muted;
  if(e.key==='e'||e.key==='E') keys._e=true;
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault(); if(k.length===1&&k>='1'&&k<='6'){useItem(ITEMS[+k-1].key);} else keys[k]=true;};
  const off=e=>{e.preventDefault(); keys[k]=false;};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});

window.FL={get P(){return P;},get boss(){return boss;},shots,hitBoss,LAIR_TOP,getT,setT,T,ORE0,rocks,checkSupport,save:saveGame,load:loadGame,explode,useItem,openShop:id=>openShop(BUILDINGS.find(b=>b.id===id))};
buildTextures();
openTitle();
requestAnimationFrame(frame);
})();
</script>
